backend:
  name: github
  repo: digizyn83/samiracoach
  branch: main
  base_url: https://samira-cms-auth.super-frost-a263.workers.dev

# Mode local (aperçu/test sans mise en ligne — actif uniquement sur localhost)
local_backend: true

# Logo de Samira sur l'écran de connexion de l'admin
logo_url: /admin/samira-logo.svg

locale: fr

media_folder: "uploads"
public_folder: "/uploads"

slug:
  encoding: "unicode"
  clean_accents: false

collections:
  # ═══ BOUTIQUE : les e-books ═══
  - name: "ebooks"
    label: "E-books (boutique)"
    label_singular: "E-book"
    folder: "_ebooks"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{price}}€"
    fields:
      - { label: "Titre du livre", name: "title", widget: "string" }
      - { label: "Prix (en €)", name: "price", widget: "number", value_type: "int", min: 0, hint: "Juste le nombre, ex : 17" }
      - { label: "Nombre de pages", name: "pages", widget: "number", value_type: "int", required: false }
      - { label: "Description", name: "description", widget: "text", hint: "2 à 4 lignes qui donnent envie de l'acheter" }
      - { label: "Couverture (image)", name: "cover", widget: "image", required: false, hint: "Laisse vide pour une jolie couverture colorée automatique" }
      - { label: "Lien Payhip (bouton Acheter)", name: "payhip_url", widget: "string", hint: "Le lien de ton livre sur Payhip, ex : https://payhip.com/b/XXXXX" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", value_type: "int", required: false, default: 1, hint: "1 = affiché en premier" }

  # ═══ BLOG : les articles ═══
  - name: "articles"
    label: "Articles"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date de publication", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Image de couverture", name: "image", widget: "image", required: false }
      - { label: "Extrait", name: "excerpt", widget: "text", required: false, hint: "Court resume qui apparait sur la page blog (2-3 lignes max)" }
      - { label: "Contenu", name: "body", widget: "markdown" }
